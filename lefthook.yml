pre-commit:
  parallel: true
  jobs:
    - name: format and lint
      group:
        piped: true
        jobs:
          - name: format
            run: bun oxfmt --write {staged_files}
            glob: "*.{js,jsx,ts,tsx,json,css,md,yml}"
            stage_fixed: true
          - name: lint
            run: bun oxlint --fix {staged_files}
            glob: "*.{ts,tsx,js,jsx}"
            stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    # run-precommit:
    #   run: bun lefthook run pre-commit

    run-tests:
      run: bun run tests

    run-audit:
      run: bun audit
